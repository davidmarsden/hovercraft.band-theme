{{ define "main" }}
  {{ partial "hc-site-header.html" . }}
  <main class="hc-content hc-post-page">
    <article class="hc-prose h-entry">
      <header class="hc-content-head">
        <p class="hc-section-label"><time class="dt-published" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2 January 2006" }}</time></p>
        {{ with .Title }}<h1 class="p-name">{{ . }}</h1>{{ end }}
      </header>
      <div class="hc-entry e-content">{{ .Content }}</div>
    </article>
  </main>
  {{ partial "hc-site-footer.html" . }}
{{ end }}
