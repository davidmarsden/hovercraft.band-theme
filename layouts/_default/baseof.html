<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}" data-hovercraft-release-live="{{ if .Site.Params.hovercraft_release_live }}true{{ else }}false{{ end }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  {{ with .Site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}
  {{ partial "microblog_head.html" . }}
  {{ partial "hc-social-meta.html" . }}
  <link rel="stylesheet" href="/css/hovercraft.css">
</head>
<body class="hc-site">
  {{ block "main" . }}{{ end }}
  <script src="/js/hovercraft.js" defer></script>
</body>
</html>
